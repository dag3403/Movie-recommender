[project]
name = "peliculas"
version = "0.1.0"
description = "Explorador de catálogo de películas con clustering y recomendaciones"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "polars>=2.0.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
peliculas = "peliculas:main"
peliculas-web = "peliculas.web:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
